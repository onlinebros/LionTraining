# app.q3.life: Laravel member application, behind Cloudflare's proxy (SSL mode
# Full (strict)). Installed as /etc/nginx/sites-available/app.q3.life.
#
# Releases live in /var/www/app.q3.life/releases and `current` points at the
# live one. $realpath_root hands PHP the resolved release path, so switching the
# symlink takes effect immediately instead of serving stale OPcache entries.

server {
    listen 80;
    listen [::]:80;
    server_name app.q3.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://app.q3.life$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.q3.life;

    # Let's Encrypt cert, renewed by certbot.timer; the deploy hook reloads nginx.
    ssl_certificate     /etc/letsencrypt/live/app.q3.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.q3.life/privkey.pem;

    # Without this every visitor reads as a Cloudflare edge address, and per-IP
    # rate limits group unrelated visitors together.
    include snippets/cloudflare-real-ip.conf;

    root /var/www/app.q3.life/current/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # Only the front controller executes.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
}
