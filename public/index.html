<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Training</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 480px;
            margin: 0 auto;
        }
        .badge {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.4rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lion Training</h1>
        <p>Site under construction. Check back soon.</p>
        <span class="badge">Coming Soon</span>
    </div>
</body>
</html>
